<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MeshArc</title>
  <desc id="desc">Your devices. Within reach. An orbital network inspired by the MeshArc app icon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#182b50"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#3b82f6" stop-opacity=".26"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
    <linearGradient id="orb" x1="910" y1="148" x2="1035" y2="280" gradientUnits="userSpaceOnUse"><stop stop-color="#a7d8ff"/><stop offset=".48" stop-color="#4a91fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="ring" x1="830" y1="80" x2="1130" y2="345" gradientUnits="userSpaceOnUse"><stop stop-color="#9acaff"/><stop offset="1" stop-color="#3d70ce" stop-opacity=".2"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#b2cbef" stroke-opacity=".04"/></pattern>
  </defs>
